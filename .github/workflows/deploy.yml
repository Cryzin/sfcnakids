name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # Share-preview tags (WhatsApp, etc.) need absolute URLs.
      # Fill the placeholder with the real site address (custom domain or github.io).
      - name: Set site URL in share tags
        run: |
          base="${{ steps.pages.outputs.base_url }}/"
          find site -name '*.html' -exec sed -i "s|__SITE_URL__|${base}|g" {} +

      - name: Guard against .html links
        run: |
          if grep -rEq 'href="[^"]*\.html' site --include=index.html; then
            echo "Found a link ending in .html"; exit 1
          fi

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
