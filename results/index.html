function get(sc,path){const p=path.trim().split('.');let v=sc[p[0]];for(let i=1;i<p.length&&v!=null;i++)v=v[p[i]];return v}
const H=/\{\{\s*([\w.]+)\s*\}\}/g;
function sub(str,sc){return str.replace(H,(m,p)=>{const v=get(sc,p);return v==null?'':v})}
function expand(node,sc,out){
 if(node.nodeType===3){out.appendChild(document.createTextNode(sub(node.nodeValue,sc)));return}
 if(node.nodeType!==1)return;
 const t=node.tagName.toLowerCase();
 if(t==='sc-for'){const m=node.getAttribute('list').match(H);H.lastIndex=0;const path=node.getAttribute('list').replace(/[{}\s]/g,'');const al=node.getAttribute('as');const list=get(sc,path)||[];
  list.forEach(it=>{const s2=Object.assign({},sc);s2[al]=it;node.childNodes.forEach(c=>expand(c,s2,out))});return}
 if(t==='sc-if'){const path=node.getAttribute('value').replace(/[{}\s]/g,'');if(get(sc,path))node.childNodes.forEach(c=>expand(c,sc,out));return}
 const el=document.createElement(node.tagName.toLowerCase());
 for(const a of node.attributes){
  if(a.name==='onclick'){const f=get(sc,a.value.replace(/[{}\s]/g,''));if(typeof f==='function')el.addEventListener('click',f);continue}
  el.setAttribute(a.name,sub(a.value,sc))}
 node.childNodes.forEach(c=>expand(c,sc,el));out.appendChild(el)}
window.__mount=function(tpl,root,Comp){const inst=new Comp();window.__rerender=()=>{const vals=inst.renderVals();const f=document.createDocumentFragment();tpl.content.childNodes.forEach(c=>expand(c,vals,f));root.replaceChildren(f)};window.__rerender()}

DATA.split('\n').forEach((raw) => {

});

const order = ['2025','2022','2021','2020','2019','2018','2016','2014'];
const years = order.map((y) => ({ label: y, on: y === yr, pick: () => this.setState({ year: y, cls: 'All' }), bg: y === yr ? '#4338CA' : '#FFFFFF', fg: y === yr ? '#FFFFFF' : '#12122B', bd: y === yr ? '#4338CA' : '#C9CEE6' }));
