am). Pre-Teen and above, one word questions, comprehension and memory verse.</p><div style="display: flex; flex-wrap: wrap; gap: 12px"><a href="../question-bank/" style="padding: 14px 24px; background: #4338CA; color: #FFFFFF; border-radius: 999px; font-weight: 600; font-size: 15px">Question bank</a><a href="../test-format/" style="padding: 14px 24px; border: 2px solid #12122B; color: #12122B; border-radius: 999px; font-weight: 600; font-size: 15px">Test format</a></div>

<div style="display: flex; flex-direction: column; gap: 10px; max-width: 760px"><span style="font-size: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #4338CA">Practice</span><h2 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: clamp(1.8rem, 3.6vw, 2.6rem); line-height: 1.12">Past papers</h2></div><p style="margin: 0; font-size: 17px; line-height: 1.6; color: #4A4D68; max-width: 720px">Test papers and question banks from earlier exams, by year and class. Each button opens a PDF.</p><div><button onClick="{{ toggle }}" aria-expanded="{{ open }}" aria-controls="papers-panel" style="display: inline-flex; align-items: center; gap: 12px; padding: 18px 28px; min-height: 56px; background: #12122B; color: #FFFFFF; border: 0; border-radius: 999px; font-family: inherit; font-weight: 600; font-size: 16px; cursor: pointer"><span>{{ toggleLabel }}</span><span aria-hidden="true" style="display: inline-block; transition: transform .2s ease; transform: {{ chevron }}">&#9662;</span></button></div><sc-if value="{{ open }}" hint-placeholder-val="{{ false }}"><div id="papers-panel" style="box-sizing: border-box; padding: clamp(20px, 3vw, 36px); background: #FFFFFF; border: 1px solid #E3E6F2; border-radius: 28px; display: flex; flex-direction: column; gap: 28px"><div role="group" aria-label="Choose a year" style="display: flex; flex-wrap: wrap; gap: 10px"><sc-for list="{{ years }}" as="y" hint-placeholder-count="5"><button onClick="{{ y.pick }}" aria-pressed="{{ y.on }}" style="padding: 12px 20px; min-height: 44px; border-radius: 999px; font-family: inherit; font-weight: 600; font-size: 15px; cursor: pointer; background: {{ y.bg }}; color: {{ y.fg }}; border: 1px solid {{ y.bd }}">{{ y.label }}</button></sc-for></div><sc-for list="{{ groups }}" as="g" hint-placeholder-count="2"><div style="display: flex; flex-direction: column; gap: 14px"><span style="font-family: 'Fraunces', Georgia, serif; font-size: 22px; font-weight: 600">{{ g.title }}</span><div style="display: flex; flex-wrap: wrap; gap: 10px"><sc-for list="{{ g.items }}" as="it" hint-placeholder-count="6"><a href="{{ it.url }}" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; background: #E0E4FF; color: #2E2790; border-radius: 14px; font-weight: 600; font-size: 15px; text-decoration: none">{{ it.label }}<span aria-hidden="true">&#8599;</span></a></sc-for></div></div></sc-for></div></sc-if>

<script>class DCLogic{constructor(){this.state={}}setState(p){this.state=Object.assign({},this.state,p);window.__rerender&&window.__rerender()}}
window.DCLogic=DCLogic;
function get(sc,path){const p=path.trim().split('.');let v=sc[p[0]];for(let i=1;i<p.length&&v!=null;i++)v=v[p[i]];return v}
const H=/\{\{\s*([\w.]+)\s*\}\}/g;
function sub(str,sc){return str.replace(H,(m,p)=>{const v=get(sc,p);return v==null?'':v})}
function expand(node,sc,out){
 if(node.nodeType===3){out.appendChild(document.createTextNode(sub(node.nodeValue,sc)));return}
 if(node.nodeType!==1)return;
 const t=node.tagName.toLowerCase();
 if(t==='sc-for'){const m=node.getAttribute('list').match(H);H.lastIndex=0;const path=node.getAttribute('list').replace(/[{}\s]/g,'');const al=node.getAttribute('as');const list=get(sc,path)||[];
  list.forEach(it=>{const s2=Object.assign({},sc);s2[al]=it;node.childNodes.forEach(c=>expand(c,s2,out))});return}
 if(t==='sc-if'){const path=node.getAttribute('value').replace(/[{}\s]/g,'');if(get(sc,path))node.childNodes.forEach(c=>expand(c,sc,out));return}
 const el=document.createElement(node.tagName.toLowerCase());
 for(const a of node.attributes){
  if(a.name==='onclick'){const f=get(sc,a.value.replace(/[{}\s]/g,''));if(typeof f==='function')el.addEventListener('click',f);continue}
  el.setAttribute(a.name,sub(a.value,sc))}
 node.childNodes.forEach(c=>expand(c,sc,el));out.appendChild(el)}
window.__mount=function(tpl,root,Comp){const inst=new Comp();window.__rerender=()=>{const vals=inst.renderVals();const f=document.createDocumentFragment();tpl.content.childNodes.forEach(c=>expand(c,vals,f));root.replaceChildren(f)};window.__rerender()}


class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const open = !!st.open;
const yr = st.year || '2025';
const base = 'https://sfcnakids.wordpress.com/wp-content/uploads/';
const mk = (title, path, list) => ({ title: title, items: list.map((x) => ({ label: x[0], url: base + path + '/' + x[1] })) });
const papers = {
'2025': [
mk('2025 test questions and answers', '2026/02', [['Primary','primary-sfcna-question-paper.pdf'],['Middler','middler-sfcna-question-paper.pdf'],['Pre-Teen','preteen-sfcna-question-paper.pdf'],['Young Teen','young-teen-sfcna-question-paper.pdf'],['High School 1','high-school-1-sfcna-question-paper.pdf'],['High School 2','high-school-2-sfcna-question-paper.pdf']]),
mk('2025 question bank', '2025/11', [['Primary','primarysfcna_2025.pdf'],['Middler','middlersfcna_2025.pdf'],['Pre-Teen','preteensfcna_2025.pdf'],['Young Teen','youngteensfcna_2025.pdf'],['High School 1','high_school_1_sfcna_2025.pdf'],['High School 2','highschool_2_sfcna_2025.pdf']])
],
'2022': [
mk('2022 final test questions', '2022/10', [['KG','sfcna_kg_2022.pdf'],['Primary','sfcna_primary_2022.pdf'],['Middler','sfcna_middler_2022.pdf'],['Junior','sfcna_junior_2022.pdf'],['Young Teen','sfcna_yt_2022.pdf'],['High School','sfcna_hs_2022.pdf']]),
mk('2022 question bank', '2022/10', [['KG','sfcna_22_kg_qb-2.pdf'],['Primary','sfcna_22_primary_qb.pdf'],['Middler','sfcna_22_middler_qb-2.pdf'],['Junior','sfcna_22_junior_qb-1.pdf'],['Young Teen','sfcna_22_youngteen_qb-1.pdf'],['High School','sfcna_22_highschool_qb-3.pdf']])
],
'2021': [
mk('2021 final exam papers', '2022/01', [['KG','sfcna_kg_2021.pdf'],['Primary','sfcna_primary_2021.pdf'],['Middler','sfcna_middler_2021.pdf'],['Junior','sfcna_junior_2021.pdf'],['Young Teen','sfcna_youngteen_2021.pdf'],['High School','sfcna_highschool_2021.pdf']]),
mk('2021 question bank', '2022/01', [['KG','sfcna-_kg_2021-1.pdf'],['Primary','sfcna-_primary_2021-2.pdf'],['Middler','sfcna-_middler_2021-2.pdf'],['Junior','sfcna-_junior_2021-1.pdf'],['Young Teen','sfcna-_young_teen_2021-1.pdf'],['High School','sfcna-_highschool_2021-1.pdf']])
],
'2020': [
mk('2020 test question papers', '2020/12', [['KG','sfcna_kg_2020.pdf'],['Primary','sfcna_primary_2020.pdf'],['Middler','sfcna_middler_2020.pdf'],['Pre-Teen','sfcna_pre_teen_2020.pdf'],['Young Teen','sfcna_young_teen_2020.pdf'],['High School (India syllabus)','sfcna_hs_india_2020.pdf'],['High School (Radiant Life syllabus)','sfcna_hs_radiant_2020.pdf']])
],
'2018': [
mk('2018 final exam', '2018/12', [['KG','sfcna-kg-2018.pdf'],['Primary','sfcna-primary-2018.pdf'],['Pre-Teen','sfcna-pre-teen-2018.pdf'],['Middler','sfcna-middler-2018.pdf'],['Young Teen','sfcna-young-teen-2018.pdf'],['High School','sfcna-high-school-2018.pdf']])
]
};
const years = ['2025','2022','2021','2020','2018'].map((y) => ({ label: y, on: y === yr, pick: () => this.setState({ year: y }), bg: y === yr ? '#4338CA' : '#FFFFFF', fg: y === yr ? '#FFFFFF' : '#12122B', bd: y === yr ? '#4338CA' : '#C9CEE6' }));
return { open: open, toggle: () => this.setState({ open: !open }), toggleLabel: open ? 'Hide past papers' : 'Practice with past papers', chevron: open ? 'rotate(180deg)' : 'rotate(0deg)', years: years, groups: papers[yr] };
}
}

window.__mount(document.getElementById("tpl"),document.getElementById("root"),Component)</script>
